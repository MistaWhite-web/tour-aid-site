<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour-Aid | Coming soon</title>
<meta name="description" content="Tour-Aid is setting up the stage. The full site is on its way.">
<meta name="theme-color" content="#0C3A39">
<meta property="og:title" content="Tour-Aid">
<meta property="og:description" content="Soundcheck in progress. The full site is on its way.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/touraid-app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600&display=swap">
<style>
  /* Tour-Aid brand tokens (from the brand style guide) */
  :root {
    --stage-teal: #0F6362;
    --cord-mint: #81CDA6;
    --deep-teal: #0C3A39;
    --stage-floor: #071F1F;
    --ink: #E6F2EB;
    --ink-muted: #A3BDB4;
    --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100svh;
    background: linear-gradient(180deg, var(--deep-teal) 0%, var(--stage-floor) 100%);
    color: var(--ink);
    font-family: var(--font-sans);
    display: grid;
    grid-template-rows: 1fr auto;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* the spotlight: a soft cone from above, pooling on the stage floor */
  .light {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 34% 12% at 50% 86%, rgba(129,205,166,.16), transparent 70%),
      conic-gradient(from 180deg at 50% -8%, transparent 0deg 162deg, rgba(129,205,166,.11) 172deg, rgba(230,242,235,.13) 180deg, rgba(129,205,166,.11) 188deg, transparent 198deg 360deg);
    filter: blur(8px);
    animation: flicker 7s ease-in-out infinite;
  }
  @keyframes flicker { 0%,100% { opacity: 1 } 46% { opacity: .82 } 50% { opacity: .95 } 53% { opacity: .78 } }

  main {
    position: relative; z-index: 1;
    display: grid; justify-items: center; align-content: center;
    gap: 28px;
    padding: 48px max(16px, env(safe-area-inset-left)) 32px;
    text-align: center;
  }
  .mark { width: clamp(140px, 24vw, 220px); height: auto; display: block; }

  .status {
    display: inline-flex; align-items: center; gap: 10px;
    font: 600 12px/16px var(--font-sans); letter-spacing: .14em; text-transform: uppercase;
    color: var(--cord-mint);
    padding: 8px 14px; border: 1px solid rgba(129,205,166,.35); border-radius: 999px;
  }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--cord-mint); box-shadow: 0 0 0 0 rgba(129,205,166,.6); animation: live 1.8s ease-out infinite; }
  @keyframes live { to { box-shadow: 0 0 0 10px rgba(129,205,166,0) } }

  h1 {
    margin: 0;
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(3rem, 10vw, 6.75rem); line-height: .92; letter-spacing: -.03em;
    text-wrap: balance;
  }
  h1 span { color: var(--cord-mint); }
  .lede { margin: 0; max-width: 34ch; font-size: clamp(1.05rem, 2.2vw, 1.25rem); line-height: 1.55; color: var(--ink-muted); }
  .lede strong { color: var(--ink); font-weight: 600; white-space: nowrap; }

  /* level meter: a mixing-desk VU strip */
  .meter { display: flex; align-items: flex-end; gap: 5px; height: 56px; margin-top: 4px; }
  .meter b {
    width: 6px; height: 100%; border-radius: 3px;
    background: linear-gradient(to top, var(--stage-teal) 0%, var(--cord-mint) 70%, #E6F2EB 100%);
    transform-origin: bottom; transform: scaleY(.18);
    animation: level var(--d, 1.1s) ease-in-out var(--o, 0s) infinite alternate;
    opacity: .9;
  }
  @keyframes level { 0% { transform: scaleY(.12) } 35% { transform: scaleY(var(--p, .7)) } 70% { transform: scaleY(.3) } 100% { transform: scaleY(var(--q, .9)) } }

  footer {
    position: relative; z-index: 1;
    display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    font-size: 13px; color: var(--ink-muted);
  }
  footer span + span::before { content: "·"; margin-right: 16px; opacity: .6; }

  @media (prefers-reduced-motion: reduce) {
    .light, .status i { animation: none; }
    .meter b { animation: none; transform: scaleY(var(--p, .6)); }
  }
</style>
</head>
<body>
  <div class="light" aria-hidden="true"></div>

  <main>
    <img class="mark" src="assets/touraid-mark-reversed.svg" alt="Tour-Aid" width="632" height="694">
    <p class="status"><i aria-hidden="true"></i>Soundcheck in progress</p>
    <h1>Check, check.<br><span>One, two.</span></h1>
    <p class="lede"><strong>Tour-Aid</strong> is setting up the stage. The full site is on its way.</p>
    <div class="meter" aria-hidden="true"></div>
  </main>

  <footer>
    <span>© <span id="yr">2026</span> Tour-Aid</span>
    <span>Coming soon</span>
  </footer>

<script>
  // build the level meter with slightly random bar timing so it never looks looped
  (function () {
    var m = document.querySelector('.meter');
    var n = window.innerWidth < 420 ? 18 : 28;
    for (var i = 0; i < n; i++) {
      var b = document.createElement('b');
      var mid = 1 - Math.abs(i - (n - 1) / 2) / ((n - 1) / 2); // taller in the middle
      b.style.setProperty('--d', (0.7 + Math.random() * 0.9).toFixed(2) + 's');
      b.style.setProperty('--o', (-Math.random() * 2).toFixed(2) + 's');
      b.style.setProperty('--p', (0.35 + mid * 0.5 + Math.random() * 0.15).toFixed(2));
      b.style.setProperty('--q', (0.25 + mid * 0.6 + Math.random() * 0.15).toFixed(2));
      m.appendChild(b);
    }
    document.getElementById('yr').textContent = new Date().getFullYear();
  })();
</script>
</body>
</html>
